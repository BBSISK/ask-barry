# Render Blueprint (infrastructure as code) for Ask Barry.
services:
  - type: web
    name: ask-barry
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # ONE worker: the job-ad agent keeps its jobs in process memory (Stage 8d). Threads serve the page's
    # progress polling while an agent run works in the background.
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy only after GitHub Actions CI passes
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true         # Render generates it; never stored in the repo
      # Azure settings. "sync: false" = the values are entered in the Render dashboard, never
      # committed, and a NEW service created from this file starts with them EMPTY (6 Oct 2026).
      # ASK-8: no API keys. The app signs in with Entra ID as the ask-barry-render service principal,
      # which can only read the index and call the models (roles in infra/identity.tf).
      - key: AZURE_AUTH_MODE
        value: entra
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_EMBED_DEPLOYMENT
        value: text-embedding-3-small
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        value: gpt-4.1-mini
      - key: AZURE_SEARCH_ENDPOINT
        sync: false
      - key: AZURE_SEARCH_INDEX
        value: ask-barry-chunks
      - key: RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: RATE_LIMIT_PER_DAY
        value: "300"
      # Stage 8d: the job-ad evidence agent costs ~2 cents per ad, so it has its own, tighter limits.
      - key: AGENT_RATE_PER_HOUR
        value: "3"
      - key: AGENT_RATE_PER_DAY
        value: "20"
      # Stage 8e: "Scan a job ad" photo reading (about a cent per photo).
      - key: SCAN_RATE_PER_HOUR
        value: "8"
      - key: SCAN_RATE_PER_DAY
        value: "60"
