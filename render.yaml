# Render Blueprint (infrastructure as code) for HDip Study Assistant.
services:
  - type: web
    name: hdip-study-assistant
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # deploy only after GitHub Actions CI passes
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true         # Render generates it; never stored in the repo
