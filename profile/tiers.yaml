# The universal tiers (Learned -> Applied -> Delivered -> Proven -> Sustained), in this profession's words.
# "criteria" is what the judge must see in a section to award the tier. Higher tiers include the lower ones.
# A pack can have 3 to 6 tiers. The top one may be "computed" (ASK-57): worked out in code from the checked
# evidence, never awarded by the AI judge, so no single generous judgement can reach it.
tiers:
  - level: 1
    universal: Learned
    label: Used
    criteria: >-
      The section shows the person, or one of their projects, actually using or working with the skill.
      A plan, an idea, a wish list or a "next step" does not count.
  - level: 2
    universal: Applied
    label: Built
    criteria: >-
      The section shows the person built, wrote or configured something themselves with the skill
      (code, configuration, a pipeline, a feature), not just used a finished product.
  - level: 3
    universal: Delivered
    label: In production
    criteria: >-
      The section shows the skill as part of a live, deployed system or an automated job that runs for
      real (a live site, a production deployment, a scheduled pipeline), not only local or planned work.
  - level: 4
    universal: Proven
    label: Tested / evaluated
    criteria: >-
      The section shows the skill-related work was tested or measured: automated tests that cover it,
      an evaluation with results, or a quality or security check that runs and is reported.
  - level: 5
    universal: Sustained
    label: Proven over time
    criteria: >-
      Not judged from one section. Reached when the skill is Tested / evaluated in at least two separate
      application projects and has been evidenced for at least 12 months, or when someone else (an employer,
      a lecturer, a certification, a merged contribution to another person's project) has confirmed it.
    computed:
      min_projects: 2
      min_months: 12
      or_third_party: true
