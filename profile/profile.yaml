# Profile pack (ASK-42 / ASK-43): who this capability page is about and where the evidence comes from.
# Everything person-specific lives in this folder, so anyone can run Ask Barry on their own evidence
# by replacing it. Nothing about the person or their profession is written in code.
profile_id: barry-sisk
person:
  name: Barry Sisk
  short_name: Barry
github_owner: BBSISK

# Repos whose text is the person describing themselves (profile README, career summary). A self-description
# isn't evidence of use (the same rule as the job-ad agent's "Listed on profile"), so these never fill a
# ladder tier. They can still supply evidence cards (e.g. leadership roles).
self_description_repos: [BBSISK]

# Section headings with these words describe plans, not done work, so they never fill a ladder tier
# (the judge is told the same, but a heading like "Architecture (planned)" still swayed it some nights).
planned_headings: [planned, roadmap, future, ideas for later]

# Projects: a friendly name and a kind for each repo (ASK-57). The kind caps how far that repo's evidence can go,
# because a LeetCode solution or a lab isn't a deployed, tested system:
#   application  a real project of mine, deployed or built to be: evidence can reach Tested / evaluated, and counts
#                toward "Proven over time"
#   practice     exercises (LeetCode, React challenges): shows I write it, so it stops at Built
#   coursework   HDip labs and assignments: stops at Built
# A repo not listed here is treated as practice, so a new repo can never over-claim by accident.
project_kinds:
  application:
    max_tier: 4
    counts_for_depth: true
    description: A real project, deployed or built to be.
  practice:
    max_tier: 2
    description: Exercises and challenges.
  coursework:
    max_tier: 2
    description: HDip labs and assignments.
default_kind: practice

projects:
  ask-barry: {name: Ask Barry, kind: application}
  wall_inspector: {name: Wall Inspector, kind: application}
  inmytime-showcase: {name: In My Time, kind: application}
  my30words_showcase: {name: Brief, kind: application}
  agentmath_showcase: {name: AgentMath, kind: application}
  housing-pipeline-ireland: {name: Housing Pipeline Ireland, kind: application}
  SECOM_Pipeline: {name: SECOM Pipeline, kind: application}
  CS627_Advanced_OOP_Java: {name: CS627 Java labs, kind: coursework}
  leetcode-java: {name: LeetCode in Java, kind: practice}
  react-challenges: {name: React challenges, kind: practice}
  BBSISK: Profile
