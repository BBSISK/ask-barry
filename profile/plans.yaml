# Copied from Barry's HDip Education & Gap-Closing Plan (9 Oct 2026); both are updated together once a month.
# A plan never fills a tier. The nightly build marks it closed only when checked evidence reaches the target,
# keeps the month that happened, and marks it overdue if the target month passes first. Every change to this
# file is dated in git history, so the plan can't be rewritten after the fact without it showing.
