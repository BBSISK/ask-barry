{# The evidence curve drawing (ASK-74), shared by /curve and the 1200x627 preview card (ASK-75). #}
    <svg viewBox="0 0 {{ curve.width }} {{ curve.height }}" aria-labelledby="curve-title">
      <title id="curve-title">{{ curve.title }} Select a dot to jump to its evidence.</title>
      <path class="rest" d="{{ curve.paths.peak_and_dip }}" aria-hidden="true"/>
      <path class="lead" d="{{ curve.paths.first }}" aria-hidden="true"/>
      <path class="lead" d="{{ curve.paths.second }}" aria-hidden="true"/>
      <g aria-hidden="true">
        <line class="bridge" x1="599" y1="470" x2="746" y2="470"/>
        <line class="strut" x1="622" y1="470" x2="622" y2="500"/>
        <line class="strut" x1="672" y1="470" x2="672" y2="510"/>
        <line class="strut" x1="722" y1="470" x2="722" y2="500"/>
        <text class="bridge-label" x="655" y="452" text-anchor="middle">{{ curve.bridge }}</text>
        <text class="dip-label" x="660" y="612" text-anchor="middle">{{ curve.dip }}</text>
        {% set first, second = curve.climbs[0], curve.climbs[1] %}
        <text class="h" x="24" y="34">{{ first.name }}</text>
        <text class="note" x="24" y="56">{{ first.note }}</text>
        <text class="h" x="700" y="34">{{ second.name }}</text>
        <text class="note" x="700" y="56">{{ second.note }}</text>
      </g>
      {% for climb in curve.climbs %}{% for n in climb.nodes %}
      <a href="#skill-{{ n.id }}" aria-label="{{ n.name }}: {{ n.tier_label }}">
        <circle class="ring" cx="{{ n.x }}" cy="{{ n.y }}" r="20"/>
        <circle class="{{ n.cls }}" cx="{{ n.x }}" cy="{{ n.y }}" r="13"/>
        {% if n.tier %}<text class="digit {{ n.cls }}" x="{{ n.x }}" y="{{ n.y + 5 }}" text-anchor="middle">{{ n.tier }}</text>{% endif %}
        <text class="name" x="{{ n.label_x }}" y="{{ n.y - 2 }}" text-anchor="{{ n.anchor }}">{{ n.name }}</text>
        <text class="sub" x="{{ n.label_x }}" y="{{ n.y + 14 }}" text-anchor="{{ n.anchor }}">{{ n.sub }}</text>
      </a>
      {% endfor %}{% endfor %}
    </svg>
