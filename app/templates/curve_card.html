<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Evidence curve card · Ask Barry</title>
  <style>
    :root { --page:#f6f7f9; --text:#10192b; --text-2:#414b63; --muted:#5a6377;
            --t1:#e2e9fb; --t2:#c9d6f8; --t3:#4a74e0; --t4:#17358f; --t5:#0b1f5c; --ink-light:#10192b; --ink-dark:#fff;
            --curve:#1f4fd8; --rest:#a3abbb; --bridge:#b85708; --bridge-ink:#8f4306; --gap:#5a6377; }
    html, body { margin:0; }
    body { width:1200px; height:627px; overflow:hidden; background:var(--page); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { box-sizing:border-box; width:1200px; height:627px; padding:28px 40px 22px; display:flex; flex-direction:column; }
    .top { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
    .kicker { font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--bridge-ink); margin:0; }
    h1 { font-size:34px; line-height:1.1; margin:6px 0 0; white-space:nowrap; }
    .legend { display:flex; gap:12px; font-size:14px; color:var(--text-2); margin:0; padding:0; list-style:none; flex-wrap:wrap; justify-content:flex-end; max-width:420px; }
    .legend li { display:flex; align-items:center; gap:6px; }
    .chip { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; font-size:12px; font-weight:700; }
    .drawing { flex:1; min-height:0; margin-top:4px; }
    .drawing svg { display:block; width:100%; height:100%; }
    .foot { display:flex; justify-content:space-between; align-items:center; font-size:16px; color:var(--text-2); }
    .foot strong { color:var(--text); font-size:20px; }
    svg .lead { fill:none; stroke:var(--curve); stroke-width:5; stroke-linecap:round; }
    svg .rest { fill:none; stroke:var(--rest); stroke-width:4; stroke-dasharray:3 9; stroke-linecap:round; }
    svg .bridge { stroke:var(--bridge); stroke-width:6; stroke-linecap:round; }
    svg .strut { stroke:var(--bridge); stroke-width:3; }
    svg .h { font:700 22px system-ui, sans-serif; fill:var(--text); }
    svg .note { display:none; }
    svg .name { font:600 17px system-ui, sans-serif; fill:var(--text); }
    svg .sub { display:none; }
    svg .bridge-label { font:700 16px system-ui, sans-serif; fill:var(--bridge-ink); }
    svg .dip-label { font:600 15px system-ui, sans-serif; fill:var(--text-2); }
    svg .digit { font:700 14px system-ui, sans-serif; }
    svg .ring { fill:transparent; stroke:transparent; }
    .t1 { fill:var(--t1); background:var(--t1); color:var(--ink-light); }
    .t2 { fill:var(--t2); background:var(--t2); color:var(--ink-light); }
    .t3 { fill:var(--t3); background:var(--t3); color:var(--ink-dark); }
    .t4 { fill:var(--t4); background:var(--t4); color:var(--ink-dark); }
    .t5 { fill:var(--t5); background:var(--t5); color:var(--ink-dark); }
    .gap { fill:var(--page); stroke:var(--gap); stroke-width:2; stroke-dasharray:4 3; background:transparent; border:2px dashed var(--gap); box-sizing:border-box; }
    svg text.t1, svg text.t2 { fill:var(--ink-light); } svg text.t3, svg text.t4, svg text.t5 { fill:var(--ink-dark); }
  </style>
</head>
<body>
<div class="card">
  <div class="top">
    <div>
      <p class="kicker">Barry Sisk · Ask Barry</p>
      <h1>{{ curve.title }}</h1>
    </div>
    <ul class="legend">
      {% for t in tiers %}<li><span class="chip t{{ t.level }}">{{ t.level }}</span>{{ t.label }}</li>{% endfor %}
      <li><span class="chip gap"></span>Not evidenced yet</li>
    </ul>
  </div>
  <div class="drawing">{% include "_curve_svg.html" %}</div>
  <div class="foot">
    <span><strong>ask-barry.onrender.com/curve</strong> · every dot links to its proof</span>
    <span>Evidence as of {{ as_of }} · inspired by Raju Dandigam's chart</span>
  </div>
</div>
</body>
</html>
